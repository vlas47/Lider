# Include inside the existing liderscan.ru HTTPS server block.
# A separate static demo release; no application or external services required.
location = /demo/motion {
    return 301 /demo/motion/;
}

# This scene loads embedded model textures through local blob URLs and uses the
# locally bundled Meshopt WebAssembly decoder. Keep these allowances scoped here.
location /demo/motion/sand/ {
    alias /srv/liderscan-demos/motion/current/sand/;
    index index.html;
    autoindex off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self'; script-src 'self' 'wasm-unsafe-eval'; font-src 'self'; connect-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
}

location /demo/motion/ {
    alias /srv/liderscan-demos/motion/current/;
    index index.html;
    autoindex off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
}
