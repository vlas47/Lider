# Include inside the existing liderscan.ru HTTPS server block.
# A separate static demo release; no application or external services required.
location = /demo/motion {
    return 301 /demo/motion/;
}

location /demo/motion/ {
    alias /srv/liderscan-demos/motion/current/;
    index index.html;
    autoindex off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
}
