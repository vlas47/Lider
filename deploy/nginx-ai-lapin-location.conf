location = /ai-lapin {
    return 301 /ai-lapin/;
}

location /ai-lapin/assets/ {
    alias /srv/AI_Lapin/frontend/dist/assets/;
    access_log off;
    expires 7d;
    add_header Cache-Control "public, immutable";
}

# Browser control and screenshots are served by dedicated, self-restarting
# monitor processes. The main Django/Gunicorn service never owns Chromium.
location /ai-lapin/profi/api/server/ {
    proxy_pass http://unix:/run/ai-lapin-profi/gunicorn.sock:/profi/api/server/;
    include proxy_params;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /ai-lapin;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
}

location /ai-lapin/freelance/api/server/ {
    proxy_pass http://unix:/run/ai-lapin-freelance/gunicorn.sock:/freelance/api/server/;
    include proxy_params;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /ai-lapin;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
}

# Compatibility routes used by older open tabs.
location /ai-lapin/api/profi-server/ {
    proxy_pass http://unix:/run/ai-lapin-profi/gunicorn.sock:/api/profi-server/;
    include proxy_params;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /ai-lapin;
    proxy_read_timeout 180s;
}

location /ai-lapin/api/freelance-server/ {
    proxy_pass http://unix:/run/ai-lapin-freelance/gunicorn.sock:/api/freelance-server/;
    include proxy_params;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /ai-lapin;
    proxy_read_timeout 180s;
}

location /ai-lapin/ {
    proxy_pass http://unix:/run/ai-lapin/gunicorn.sock:/;
    include proxy_params;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /ai-lapin;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
}
