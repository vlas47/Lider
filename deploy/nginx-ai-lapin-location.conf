location = /ai-lapin {
    return 301 /ai-lapin/;
}

location /ai-lapin/assets/ {
    alias /srv/AI_Lapin/frontend/dist/assets/;
    access_log off;
    expires 7d;
    add_header Cache-Control "public, immutable";
}

location /ai-lapin/ {
    proxy_pass http://unix:/run/ai-lapin/gunicorn.sock:/;
    include proxy_params;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /ai-lapin;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
}
